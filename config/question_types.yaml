# Question Type Definitions

types:
  proof:
    keywords:
      - prove
      - proof
      - demonstrate
      - verify
    description: "Questions asking to prove or demonstrate something"
    examples:
      - "Prove that PALINDROME is non-context-free"
      - "Show that the language is regular"
  
  build:
    keywords:
      - build
      - construct
      - design
      - create
    description: "Questions asking to build or construct something"
    examples:
      - "Build a TM that accepts {a^n b^n}"
      - "Construct a PDA for the language"
  
  draw:
    keywords:
      - draw
      - sketch
      - diagram
      - illustrate
    description: "Questions asking to draw or diagram something"
    examples:
      - "Draw an FA for the language"
      - "Sketch a parse tree"
  
  find:
    keywords:
      - find
      - determine
      - calculate
      - compute
    description: "Questions asking to find or calculate something"
    examples:
      - "Find a CFG for the language"
      - "Determine if the string is accepted"
  
  explain:
    keywords:
      - explain
      - describe
      - discuss
      - define
    description: "Questions asking for explanation or description"
    examples:
      - "Explain the pumping lemma"
      - "Describe how the algorithm works"
  
  trace:
    keywords:
      - trace
      - follow
      - track
      - execute
    description: "Questions asking to trace execution"
    examples:
      - "Trace the execution of the input string"
      - "Follow the path through the automaton"
  
  convert:
    keywords:
      - convert
      - transform
      - translate
    description: "Questions asking to convert between representations"
    examples:
      - "Convert the NFA to an FA"
      - "Transform to CNF"


